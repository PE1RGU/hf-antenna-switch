# Host workspace: no_std core crates and the simulator.
# The ESP32-C3 binaries in targets/ are separate workspaces (own target and build config).
[workspace]
resolver = "3"
members = ["crates/*", "sim/*"]
exclude = ["targets"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Prins Doornekamp PE1RGU"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
