[package]
name = "sim-shack"
version = "0.1.0"
description = "Runs the shack firmware logic on the shack board model, against a scripted box"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
box-core = { path = "../../crates/box-core" }
embedded-hal = "1"
host-proto = { version = "0.1.0", path = "../../crates/host-proto" }
image = { version = "0.25.10", default-features = false }
link-proto = { path = "../../crates/link-proto" }
png = "0.18"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
shack-core = { path = "../../crates/shack-core" }
shack-ui = { version = "0.1.0", path = "../../crates/shack-ui" }
sim-box = { path = "../sim-box" }
sim-core = { path = "../sim-core" }
sim-models = { path = "../sim-models" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["term", "fs"] }

[lints]
workspace = true

[dev-dependencies]
embedded-graphics = "0.8"
