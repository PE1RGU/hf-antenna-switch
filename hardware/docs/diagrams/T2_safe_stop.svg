   </g>
   <g id="text_34">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="413.051976" transform="rotate(-0 22.677165 413.051976)">The shack latch holds the inhibit after the loop current returns: TX stays inhibited until RESET is pressed with the current present (L3 sequences L1 to L5).</text>
   </g>
   <g id="text_35">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="424.390559" transform="rotate(-0 22.677165 424.390559)">After RESET the shack firmware sends permits again (R2, R3 by handshake, T3); the box sets up its expanders before it switches (F5, F11).</text>
   </g>
  </g>
 </g>
