   <g id="text_31">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="376.201583" transform="rotate(-0 22.677165 376.201583)">End: the shack drops permit and key (inhibit first), waits for TX sense 0 and at least 100 ms (F14), then sends 'end'; only then the box releases K0.</text>
   </g>
   <g id="text_32">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="387.540165" transform="rotate(-0 22.677165 387.540165)">Rule F13: while a permit is out the box does not change that radio's K0 or rows. On a link time-out it opens SAFE (MCU_EN_N = 1), it does not release K0.</text>
   </g>
