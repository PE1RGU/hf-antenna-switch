   <g id="text_22">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="492.725993" transform="rotate(-0 22.677165 492.725993)">F13: while a permit is out, never change that radio's K0 or rows. Link time-out: set MCU_EN_N = 1 (opens SAFE, inhibits every radio), do not release K0.</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="504.064575" transform="rotate(-0 22.677165 504.064575)">Kick WDI only from the main loop, never from a timer interrupt. LATCH_CLR only after the start-up self-test, and after a fault only when its cause is checked (D-59).</text>
   </g>
   <g id="text_24">
