    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f4e9c" x="538.582677" y="109.454942" transform="rotate(-0 538.582677 109.454942)">U15  74LVC1G02</text>
   </g>
