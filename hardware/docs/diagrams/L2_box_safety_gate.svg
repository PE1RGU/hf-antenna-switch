    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="22.677165" y="312.944882" transform="rotate(-0 22.677165 312.944882)">KILL (U3 opto: no loop current = 1, L1)</text>
   </g>
   <g id="text_23">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="615.11811" y="130.609422" transform="rotate(-0 615.11811 130.609422)">&amp;</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f4e9c" x="615.11811" y="115.124233" transform="rotate(-0 615.11811 115.124233)">U16  74LVC1G08</text>
   </g>
   <g id="text_25">
    <text style="font-size: 5.8px; font-family: 'DejaVu Sans'; text-anchor: start" x="574.015748" y="128.692913" transform="rotate(-0 574.015748 128.692913)">READY_ON</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(629.291339 179.511023)">RF_A2_N (J2 pin 17): low = RF on A2,</text>
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'" transform="translate(629.291339 186.855623)">100k pull-down (D-104, SR-01 H2)</text>
   </g>
   <g id="text_27">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'" transform="translate(663.307087 138.44087)">240R to the READY</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'" transform="translate(663.307087 145.831426)">switch U6 (L1)</text>
   </g>
   <g id="text_28">
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'" transform="translate(629.291339 236.052583)">RLY_EN: RESET of U901 to U903,</text>
    <text style="font-size: 6.6px; font-family: 'DejaVu Sans'" transform="translate(629.291339 243.626702)">U1001; +12V_SW switch</text>
   </g>
   <g id="text_29">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="362.332292" transform="rotate(-0 22.677165 362.332292)">FAULT is set (Q = 1) by RESET_N low: power-up (td 120 to 300 ms), 3V3 below 2.83 to 3.00 V, or no WDI edge for 0.9 to 2.5 s (C-19).</text>
   </g>
   <g id="text_30">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="373.670875" transform="rotate(-0 22.677165 373.670875)">Only a LATCH_CLR rising edge with RESET_N high clears FAULT. KILL is not latched in the box: the shack latch holds the stop (L3).</text>
   </g>
   <g id="text_31">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="385.009457" transform="rotate(-0 22.677165 385.009457)">RLY_EN = 1 only with KILL = 0, MCU_EN_N = 0 and FAULT = 0. READY_ON leaves out KILL, so the SAFE loop can close at start-up (F11).</text>
   </g>
   <g id="text_32">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="396.34804" transform="rotate(-0 22.677165 396.34804)">RF on A2 opens READY: no loop current, so KILL = 1 drops RLY_EN in the box and the shack latch inhibits all radios (D-104).</text>
   </g>
   <g id="text_33">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="407.686623" transform="rotate(-0 22.677165 407.686623)">Output indicator: polarity triangle (low-active), as in the schematics. Gate delays 5.4 ns max (M-10).</text>
   </g>
