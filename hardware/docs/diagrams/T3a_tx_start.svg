   <g id="text_31">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="376.201583" transform="rotate(-0 22.677165 376.201583)">Box: on a request it checks the state (H1 to H4), sets K0 through U903, waits 12 ms (operate 8 + bounce 4 ms), reads back and sends the permit.</text>
   </g>
   <g id="text_32">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="387.540165" transform="rotate(-0 22.677165 387.540165)">Messages take 4 ms at 9600 baud (C-18). The shack opens TX INH (PERMIT) only after the permit; the radio is keyed after that.</text>
   </g>
