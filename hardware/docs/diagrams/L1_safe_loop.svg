   <g id="text_19">
    <text style="font-size: 6.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="734.173228" y="208.574954" transform="rotate(-0 734.173228 208.574954)">READY_ON</text>
