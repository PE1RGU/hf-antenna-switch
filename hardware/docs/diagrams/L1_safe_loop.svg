    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #6b6b6b" transform="translate(483.281211 254.153069)">READY = NOR(MCU_EN_N, FAULT) AND RF_A2_N (U15, U16)</text>
    <text style="font-size: 6.2px; font-family: 'DejaVu Sans'; fill: #6b6b6b" transform="translate(516.215321 261.26815)">KILL is not an input: the loop can start</text>
