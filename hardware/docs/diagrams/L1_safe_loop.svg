   <g id="text_21">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="603.779528" y="81.020876" transform="rotate(-0 603.779528 81.020876)">KILL to the RLY_EN gate U14 (L2)</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="221.102362" y="358.816151" transform="rotate(-0 221.102362 358.816151)">SAFE_LOST: high = no current (L3, IO21)</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="416.19056" transform="rotate(-0 22.677165 416.19056)">Any break stops the current (wired AND): shack supply off, KILL pressed, software stop, cable cut, box dead, box FAULT or MCU_EN_N high,</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="427.529142" transform="rotate(-0 22.677165 427.529142)">or RF on the receive-only column A2 (D-104, SR-01 H2).</text>
   </g>
   <g id="text_25">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="438.867725" transform="rotate(-0 22.677165 438.867725)">Box: no current = KILL high = RLY_EN low: expanders in reset, +12V_SW off, all row relays and R2/R3 K0 open (F12).</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="450.206308" transform="rotate(-0 22.677165 450.206308)">Shack: no current = SAFE_LOST high: the SAFE latch sets; TX_EN low inhibits every radio until RESET with the current back (D-75).</text>
   </g>
