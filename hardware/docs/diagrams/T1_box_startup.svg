    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="401.713394" transform="rotate(-0 22.677165 401.713394)">Order (F11): LATCH_CLR, then MCU_EN_N = 0, then wait for KILL = 0 with a time-out ('SAFE loop open'). READY_ON leaves out KILL, so the loop can close.</text>
   </g>
   <g id="text_35">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="413.051976" transform="rotate(-0 22.677165 413.051976)">The shack must have its current source on (SW_STOP_N high) and KILL closed; otherwise KILL stays 1 and RLY_EN stays 0.</text>
   </g>
   <g id="text_36">
    <text style="font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1d1d1f" x="22.677165" y="424.390559" transform="rotate(-0 22.677165 424.390559)">Times: td from TPS3823A-33 (120 / 200 / 300 ms, C-19); boot time of the ESP32-C3 is an estimate (to measure). Loop current follows READY within microseconds.</text>
   </g>
  </g>
 </g>
 <defs>
